<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Daily Reminder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Rüya gibi mor, gece mavisi ve lila renk geçişi */
            background: linear-gradient(135deg, #1d0a34 0%, #3a1c5c 50%, #6a2597 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Arka planda parıldayan sihirli yıldızlar efekti */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 50px 160px, #fff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 80px 120px, #ffd700, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 190px, #ffb6c1, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 300px, #fff, rgba(0,0,0,0));
            background-size: 300px 300px;
            animation: twinkle 4s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        /* Lüks, şeffaf buzlu cam kart tasarımı */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .message {
            font-size: 21px;
            color: #ffe5ec;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 40px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Parlayan neon mor buton */
        .btn {
            background: linear-gradient(135deg, #b76eff 0%, #7b2cbf 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(183, 110, 255, 0.4);
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(183, 110, 255, 0.6);
            background: linear-gradient(135deg, #c482ff 0%, #9d4edd 100%);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="card">
        <h1>✨ Your Daily Reminder ✨</h1>
        <div class="message" id="msg">Loading your universe...</div>
        <button class="btn" onclick="getNewMessage()">Give Me Another One</button>
    </div>

    <script>
        const messages = [
            "You are doing so much better than you think you are. Keep going!",
            "Believe in yourself, because the world is a better place with you in it. ✨",
            "Take a deep breath. You can handle whatever today brings.",
            "You are worthy of all the beautiful things coming your way.",
            "Don't forget to smile today; your energy is genuinely wonderful. 😊",
            "Slow down, grab a warm drink, and be proud of how far you've come.",
            "You have the power to create a beautiful day today.",
            "Your potential is endless. Trust the timing of your life. 🌸",
            "Be kind to yourself today. You are doing the best you can.",
            "A small progress is still progress. Every single step counts!",
            "You are strong, you are loved, and you are entirely enough."
        ];

        function getNewMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("msg").innerText = messages[randomIndex];
        }

        getNewMessage();
    </script>

</body>
</html>
