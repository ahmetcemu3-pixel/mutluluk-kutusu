<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Daily Reminder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* İnternetten resim çekmeyen, kesin çalışan Boho Bej & Soft Krem renk geçişi */
            background: linear-gradient(135deg, #efe6dd 0%, #dbcbbe 50%, #c3b0a0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            border: 1px solid #eaddcf;
        }
        h1 {
            color: #5c4d4d;
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .message {
            font-size: 21px;
            color: #8c6239;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 35px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn {
            background-color: #8c6239;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(140, 98, 57, 0.2);
        }
        .btn:hover {
            background-color: #6d4a2a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ Your Daily Reminder ✨</h1>
        <div class="message" id="msg">Loading your reminder...</div>
        <button class="btn" onclick="getNewMessage()">Give Me Another One</button>
    </div>

    <script>
        const kelimeler = [
            "You are doing so much better than you think you are. Keep going!",
            "Believe in yourself, because the world is a better place with you in it. ✨",
            "Take a deep breath. You can handle whatever today brings.",
            "You are worthy of all the beautiful things coming your way.",
            "Don't forget to smile today; your energy is genuinely wonderful. 😊",
            "Slow down, grab a warm drink, and be proud of how far you've come.",
            "You have the power to create a beautiful day today.",
            "Your potential is endless. Trust the timing of your life. 🌸",
            "Be kind to yourself today. You are doing the best you can.",
            "A small progress is still progress. Every single step counts!",
            "You are strong, you are loved, and you are entirely enough."
        ];

        function getNewMessage() {
            const randomIndex = Math.floor(Math.random() * kelimeler.length);
            document.getElementById("msg").innerText = kelimeler[randomIndex];
        }

        getNewMessage();
    </script>

</body>
</html>
